  <rect width="1400" height="1000" fill="#f8fafc"/>

  <text x="48" y="56" font-size="30" font-weight="700" fill="#0f172a">Fin101 — Sistem Mimarisi</text>
  <text x="48" y="84" font-size="15" fill="#64748b">Finansal okuryazarlık ve yapay zekâ mentorluk platformu · YZTA 2026 Takım 101</text>

  <!-- ============ İSTEMCİ ============ -->
  <rect x="48" y="118" width="360" height="176" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#golge)"/>
  <text x="72" y="148" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="1.2">İSTEMCİ</text>
  <text x="72" y="180" font-size="19" font-weight="600" fill="#0f172a">React + Vite</text>
  <text x="72" y="204" font-size="13.5" fill="#475569">Tailwind · Recharts · React Router</text>
  <text x="72" y="232" font-size="13" fill="#64748b">Dashboard · Simülasyon · Haber · Chatbot</text>
  <rect x="72" y="248" width="312" height="30" rx="7" fill="#dbeafe"/>
  <text x="84" y="268" font-size="12.5" fill="#1e40af">Vercel · yzta2026-team101.vercel.app</text>

  <!-- ============ BACKEND ============ -->
  <rect x="500" y="118" width="404" height="452" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#golge)"/>
  <text x="524" y="148" font-size="12" font-weight="700" fill="#15803d" letter-spacing="1.2">UYGULAMA SUNUCUSU</text>
  <text x="524" y="180" font-size="19" font-weight="600" fill="#0f172a">FastAPI · Python 3.11</text>
  <rect x="524" y="196" width="356" height="30" rx="7" fill="#dcfce7"/>
  <text x="536" y="216" font-size="12.5" fill="#166534">Render · Frankfurt · fin101-api.onrender.com</text>

  <rect x="524" y="240" width="356" height="42" rx="9" fill="#ffffff" stroke="#d1fae5"/>
  <text x="538" y="258" font-size="13.5" font-weight="600" fill="#0f172a">CORS + Hata Yakalayıcı</text>
  <text x="538" y="274" font-size="11.5" fill="#64748b">izinli origin listesi + *.vercel.app kalıbı</text>

  <rect x="524" y="294" width="172" height="66" rx="9" fill="#ffffff" stroke="#d1fae5"/>
  <text x="538" y="314" font-size="13.5" font-weight="600" fill="#0f172a">auth.py</text>
  <text x="538" y="332" font-size="11.5" fill="#64748b">JWT · bcrypt</text>
  <text x="538" y="348" font-size="11.5" fill="#64748b">/auth/register · /auth/login</text>

  <rect x="708" y="294" width="172" height="66" rx="9" fill="#ffffff" stroke="#d1fae5"/>
  <text x="722" y="314" font-size="13.5" font-weight="600" fill="#0f172a">simulation.py</text>
  <text x="722" y="332" font-size="11.5" fill="#64748b">al / sat · portföy · XP</text>
  <text x="722" y="348" font-size="11.5" fill="#64748b">/stocks · /transactions</text>

  <rect x="524" y="372" width="172" height="66" rx="9" fill="#ffffff" stroke="#d1fae5"/>
  <text x="538" y="392" font-size="13.5" font-weight="600" fill="#0f172a">graph.py</text>
