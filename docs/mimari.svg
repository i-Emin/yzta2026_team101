  <text x="538" y="426" font-size="11.5" fill="#64748b">mentor / analyst düğümü</text>

  <rect x="708" y="372" width="172" height="66" rx="9" fill="#ffffff" stroke="#d1fae5"/>
  <text x="722" y="392" font-size="13.5" font-weight="600" fill="#0f172a">rag.py</text>
  <text x="722" y="410" font-size="11.5" fill="#64748b">PDF → 58 parça</text>
  <text x="722" y="426" font-size="11.5" fill="#64748b">pgvector arama</text>

  <rect x="524" y="450" width="172" height="66" rx="9" fill="#ffffff" stroke="#d1fae5"/>
  <text x="538" y="470" font-size="13.5" font-weight="600" fill="#0f172a">api/market · api/news</text>
  <text x="538" y="488" font-size="11.5" fill="#64748b">yfinance · finnhub</text>
  <text x="538" y="504" font-size="11.5" fill="#64748b">60 sn önbellek</text>

  <rect x="708" y="450" width="172" height="66" rx="9" fill="#ffffff" stroke="#d1fae5"/>
  <text x="722" y="470" font-size="13.5" font-weight="600" fill="#0f172a">telegram_bot.py</text>
  <text x="722" y="488" font-size="11.5" fill="#64748b">APScheduler cron</text>
  <text x="722" y="504" font-size="11.5" fill="#64748b">sabah bülteni</text>

  <rect x="524" y="528" width="356" height="28" rx="7" fill="#f1f5f9"/>
  <text x="538" y="547" font-size="11.5" fill="#475569">db_pg.py — asyncpg bağlantı havuzu (veri erişim katmanı)</text>

  <!-- ============ VERİTABANI ============ -->
  <rect x="996" y="118" width="356" height="272" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#golge)"/>
  <text x="1020" y="148" font-size="12" font-weight="700" fill="#6d28d9" letter-spacing="1.2">VERİTABANI</text>
  <text x="1020" y="180" font-size="19" font-weight="600" fill="#0f172a">Supabase · PostgreSQL 16</text>
  <rect x="1020" y="196" width="308" height="30" rx="7" fill="#ede9fe"/>
  <text x="1032" y="216" font-size="12.5" fill="#5b21b6">Session pooler · Singapur (ap-southeast-1)</text>

  <rect x="1020" y="240" width="146" height="60" rx="9" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="1034" y="260" font-size="12.5" font-weight="600" fill="#0f172a">users</text>
  <text x="1034" y="277" font-size="11" fill="#64748b">bakiye · XP · rozet</text>
  <text x="1034" y="292" font-size="11" fill="#64748b">risk profili</text>

  <rect x="1182" y="240" width="146" height="60" rx="9" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="1196" y="260" font-size="12.5" font-weight="600" fill="#0f172a">transactions</text>
  <text x="1196" y="277" font-size="11" fill="#64748b">al / sat kayıtları</text>
  <text x="1196" y="292" font-size="11" fill="#64748b">ortalama maliyet</text>

  <rect x="1020" y="312" width="146" height="60" rx="9" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="1034" y="332" font-size="12.5" font-weight="600" fill="#0f172a">conversations</text>
  <text x="1034" y="349" font-size="11" fill="#64748b">messages</text>
  <text x="1034" y="364" font-size="11" fill="#64748b">sohbet hafızası</text>

  <rect x="1182" y="312" width="146" height="60" rx="9" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1196" y="332" font-size="12.5" font-weight="600" fill="#6d28d9">pgvector</text>
  <text x="1196" y="349" font-size="11" fill="#64748b">58 embedding</text>
  <text x="1196" y="364" font-size="11" fill="#64748b">RAG koleksiyonu</text>

  <!-- ============ DIŞ SERVİSLER ============ -->
  <rect x="996" y="440" width="356" height="290" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#golge)"/>
  <text x="1020" y="470" font-size="12" font-weight="700" fill="#c2410c" letter-spacing="1.2">DIŞ SERVİSLER</text>

  <rect x="1020" y="488" width="308" height="54" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1034" y="508" font-size="13.5" font-weight="600" fill="#0f172a">Google Gemini API</text>
  <text x="1034" y="527" font-size="11.5" fill="#64748b">gemini-flash-latest · gemini-embedding-001</text>

  <rect x="1020" y="552" width="308" height="54" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1034" y="572" font-size="13.5" font-weight="600" fill="#0f172a">Yahoo Finance</text>
  <text x="1034" y="591" font-size="11.5" fill="#64748b">yfinance · BIST ve ABD hisse fiyatları</text>

  <rect x="1020" y="616" width="308" height="54" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1034" y="636" font-size="13.5" font-weight="600" fill="#0f172a">Finnhub</text>
  <text x="1034" y="655" font-size="11.5" fill="#64748b">piyasa ve şirket haberleri</text>

  <rect x="1020" y="680" width="308" height="34" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1034" y="702" font-size="13.5" font-weight="600" fill="#0f172a">Telegram Bot API</text>

  <!-- ============ OKLAR ============ -->
  <line x1="408" y1="206" x2="492" y2="206" stroke="#2563eb" stroke-width="2.5" marker-end="url(#okMavi)"/>
  <text x="416" y="196" font-size="12" font-weight="600" fill="#1d4ed8">HTTPS / JWT</text>
  <text x="416" y="222" font-size="11" fill="#64748b">VITE_API_URL</text>

  <line x1="904" y1="270" x2="988" y2="270" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#okMor)"/>
  <text x="908" y="260" font-size="12" font-weight="600" fill="#6d28d9">asyncpg</text>
  <text x="908" y="286" font-size="11" fill="#64748b">TLS · 5432</text>

  <!-- pgvector: paneller arasindaki bosluktan gecip alttan giriyor -->
  <path d="M 904 400 C 1010 412, 1180 414, 1252 380" stroke="#7c3aed" stroke-width="2" fill="none"
        stroke-dasharray="5,4" marker-end="url(#okMor)"/>
  <text x="1030" y="432" font-size="11" font-weight="600" fill="#6d28d9">vektör arama · RAG</text>

  <!-- dis servisler: hepsi panel kenarindan yelpaze halinde -->
  <path d="M 904 468 C 950 470, 975 500, 1012 512" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#okYesil)"/>
  <text x="912" y="460" font-size="11" font-weight="600" fill="#047857">LLM + embedding</text>

  <path d="M 904 498 C 950 505, 975 560, 1012 577" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ok)"/>
  <path d="M 904 524 C 952 540, 972 620, 1012 641" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ok)"/>
  <path d="M 904 548 C 954 580, 968 680, 1012 697" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ok)"/>

  <!-- ============ SOHBET AKIŞI ============ -->
  <rect x="48" y="330" width="360" height="378" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#golge)"/>
  <text x="72" y="360" font-size="12" font-weight="700" fill="#334155" letter-spacing="1.2">SOHBET AKIŞI</text>

  <circle cx="86" cy="392" r="13" fill="#dbeafe"/>
  <text x="86" y="397" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text>
  <text x="110" y="390" font-size="13" font-weight="600" fill="#0f172a">Kullanıcı mesajı</text>
  <text x="110" y="407" font-size="11.5" fill="#64748b">JWT ile /chat/ endpoint'ine</text>

  <circle cx="86" cy="440" r="13" fill="#dbeafe"/>
  <text x="86" y="445" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">2</text>
  <text x="110" y="438" font-size="13" font-weight="600" fill="#0f172a">Mesaj + geçmiş kaydı</text>
  <text x="110" y="455" font-size="11.5" fill="#64748b">Postgres · son 10 mesaj okunur</text>

  <circle cx="86" cy="488" r="13" fill="#dbeafe"/>
  <text x="86" y="493" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">3</text>
  <text x="110" y="486" font-size="13" font-weight="600" fill="#0f172a">Girdi güvenlik denetimi</text>
  <text x="110" y="503" font-size="11.5" fill="#64748b">guardrails.py</text>

  <circle cx="86" cy="536" r="13" fill="#ede9fe"/>
  <text x="86" y="541" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle">4</text>
  <text x="110" y="534" font-size="13" font-weight="600" fill="#0f172a">RAG bağlamı</text>
  <text x="110" y="551" font-size="11.5" fill="#64748b">pgvector · erişilemezse atlanır</text>

  <circle cx="86" cy="584" r="13" fill="#d1fae5"/>
  <text x="86" y="589" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">5</text>
  <text x="110" y="582" font-size="13" font-weight="600" fill="#0f172a">Gemini yanıtı</text>
  <text x="110" y="599" font-size="11.5" fill="#64748b">profil + portföy ile kişiselleştirilir</text>

  <circle cx="86" cy="632" r="13" fill="#fef3c7"/>
  <text x="86" y="637" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">6</text>
  <text x="110" y="630" font-size="13" font-weight="600" fill="#0f172a">Çıktı denetimi</text>
  <text x="110" y="647" font-size="11.5" fill="#64748b">yatırım tavsiyesi filtresi</text>

  <circle cx="86" cy="680" r="13" fill="#dbeafe"/>
  <text x="86" y="685" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">7</text>
  <text x="110" y="678" font-size="13" font-weight="600" fill="#0f172a">Yanıt + XP</text>
  <text x="110" y="695" font-size="11.5" fill="#64748b">kaydedilir ve istemciye döner</text>

  <!-- ============ TASARIM KARARLARI ============ -->
  <rect x="48" y="760" width="1304" height="196" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#golge)"/>
  <text x="72" y="790" font-size="12" font-weight="700" fill="#334155" letter-spacing="1.2">TASARIM KARARLARI</text>

  <text x="72" y="822" font-size="13" font-weight="600" fill="#0f172a">MongoDB → PostgreSQL</text>
  <text x="72" y="842" font-size="11.5" fill="#64748b">Ortalama maliyet hesabı SQL fonksiyonuna taşındı;</text>
  <text x="72" y="859" font-size="11.5" fill="#64748b">satışlar artık maliyet tabanını doğru düşürüyor.</text>

  <text x="410" y="822" font-size="13" font-weight="600" fill="#0f172a">ChromaDB → pgvector</text>
  <text x="410" y="842" font-size="11.5" fill="#64748b">torch bağımlılığı kaldırıldı: container 2 GB → 545 MB,</text>
  <text x="410" y="859" font-size="11.5" fill="#64748b">bellek 240 MB. Ücretsiz katmana sığması için gerekliydi.</text>

  <text x="762" y="822" font-size="13" font-weight="600" fill="#0f172a">Kademeli bozulma</text>
  <text x="762" y="842" font-size="11.5" fill="#64748b">RAG veya piyasa verisi erişilemezse ilgili özellik</text>
  <text x="762" y="859" font-size="11.5" fill="#64748b">devre dışı kalır, uygulama ayakta kalmaya devam eder.</text>

  <text x="1090" y="822" font-size="13" font-weight="600" fill="#0f172a">Yapılandırma</text>
  <text x="1090" y="842" font-size="11.5" fill="#64748b">Model adları, CORS ve RAG parametreleri ortam</text>
  <text x="1090" y="859" font-size="11.5" fill="#64748b">değişkeninde; deploy gerektirmeden değiştirilebilir.</text>

  <line x1="72" y1="884" x2="1328" y2="884" stroke="#e2e8f0"/>
  <text x="72" y="910" font-size="11.5" fill="#94a3b8">Kimlik doğrulama uygulama tarafında (JWT). Tüm tablolarda RLS açık; veritabanına yalnızca backend doğrudan bağlantıyla erişiyor,</text>
  <text x="72" y="930" font-size="11.5" fill="#94a3b8">frontend hiçbir tabloya doğrudan gitmiyor. Barındırma: Render ve Supabase ücretsiz katman.</text>
</svg>
